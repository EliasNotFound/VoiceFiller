<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VoiceFill</title>
<style>
  body { margin: 0; width: 280px; background: #fff; color: #1b7a3e; font: 600 18px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  button { display: block; width: 100%; padding: 16px; font: 800 20px system-ui; background: #1b7a3e; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 4px solid #111; outline-offset: 3px; }
  a { display: block; margin-top: 14px; color: #1b7a3e; }
  p { font-size: 15px; font-weight: 500; color: #333; }
</style>
</head>
<body>
  <h1>VoiceFill</h1>
  <button id="start" autofocus>Fill this form</button>
  <p>Shortcut: Alt + Shift + F. Press Escape to stop.</p>
  <a href="options.html" target="_blank">Profile and settings</a>
  <script src="popup.js"></script>
</body>
</html>
